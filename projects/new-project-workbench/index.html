<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#07100c" />
    <title>SharkCoach</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Microsoft YaHei", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100dvh;
        margin: 0;
        place-items: center;
        color: #f4f2e9;
        background:
          radial-gradient(circle at 24% 12%, rgba(230, 189, 103, 0.14), transparent 28rem),
          linear-gradient(135deg, #06120e, #0b1713 52%, #130f0b);
      }

      main {
        width: min(560px, calc(100% - 32px));
        padding: 28px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.055);
      }

      p {
        margin: 0;
        color: #a8b2aa;
        line-height: 1.6;
      }

      strong {
        display: block;
        margin-bottom: 10px;
        font-size: 1.35rem;
      }
    </style>
  </head>
  <body>
    <main>
      <strong>SharkCoach 服务已部署</strong>
      <p>训练区使用独立路径和登录页保护，不在公开网站页面展示入口。</p>
    </main>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          registrations.forEach((registration) => registration.unregister());
        });
      }
      if ("caches" in window) {
        caches.keys().then((keys) => keys.filter((key) => key.startsWith("sharkcoach")).forEach((key) => caches.delete(key)));
      }
    </script>
  </body>
</html>
