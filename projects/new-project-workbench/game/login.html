<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#07100c" />
    <title>SharkCoach 训练登录</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./login.css" />
  </head>
  <body>
    <main class="login-shell" aria-label="训练模式登录">
      <section class="login-panel">
        <div class="brand-lockup">
          <div class="brand-mark" aria-hidden="true">S</div>
          <div>
            <p class="eyebrow">训练模式</p>
            <h1>SharkCoach 登录</h1>
          </div>
        </div>

        <form id="loginForm" class="login-form">
          <label>
            <span>账号</span>
            <input id="username" name="username" type="text" autocomplete="username" required />
          </label>
          <label>
            <span>密码</span>
            <input id="password" name="password" type="password" autocomplete="current-password" required />
          </label>
          <button class="login-button" type="submit">进入训练</button>
          <p id="loginMessage" class="login-message" role="status"></p>
        </form>
      </section>
    </main>
    <script src="./login.js"></script>
  </body>
</html>
