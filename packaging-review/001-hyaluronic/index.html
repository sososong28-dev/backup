<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f766e'/%3E%3Cpath d='M8 17h16v3H8zM8 11h16v3H8z' fill='white'/%3E%3C/svg%3E"
    />
    <title>产品委员会包装筛选展示</title>
    <style>
      :root {
        color-scheme: light;
        --page: #f5f1e8;
        --ink: #171717;
        --muted: #6d6a63;
        --line: #d6d0c2;
        --panel: #fffdf8;
        --accent: #0f766e;
        --accent-ink: #ffffff;
        --hold: #b45309;
        --out: #a33434;
        --shadow: 0 14px 34px rgba(24, 24, 24, 0.12);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Microsoft YaHei", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        color: var(--ink);
        background:
          linear-gradient(90deg, rgba(15, 118, 110, 0.08), transparent 28%),
          linear-gradient(180deg, #fbf8f1, var(--page));
      }

      button,
      input {
        font: inherit;
      }

      button {
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }

      .file-input {
        display: none;
      }

      .host-only.is-hidden {
        display: none;
      }

      .app {
        display: grid;
        grid-template-rows: auto 1fr;
        height: 100dvh;
      }

      .topbar {
        display: grid;
        grid-template-columns: minmax(230px, 1fr) auto;
        gap: 16px;
        align-items: center;
        min-height: 74px;
        padding: 12px 18px 10px;
        border-bottom: 1px solid var(--line);
        background: rgba(255, 253, 248, 0.94);
      }

      .title {
        min-width: 0;
      }

      h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 760;
        line-height: 1.12;
        letter-spacing: 0;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 6px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.2;
      }

      .sync-state {
        color: var(--accent);
        font-weight: 700;
      }

      .sync-state.error {
        color: var(--out);
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 8px;
      }

      .segmented,
      .pager,
      .searchbox {
        display: flex;
        align-items: center;
        gap: 4px;
        height: 38px;
        padding: 4px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      .searchbox {
        width: 220px;
        padding-inline: 10px;
      }

      .searchbox input {
        width: 100%;
        min-width: 0;
        border: 0;
        outline: 0;
        color: var(--ink);
        background: transparent;
      }

      .button {
        display: inline-grid;
        min-width: 34px;
        height: 30px;
        place-items: center;
        border: 0;
        border-radius: 6px;
        color: var(--ink);
        background: transparent;
        cursor: pointer;
      }

      .button:hover {
        background: #eee7db;
      }

      .button.active {
        color: var(--accent-ink);
        background: var(--accent);
      }

      .button.text {
        padding: 0 10px;
      }

      .button.icon {
        font-size: 18px;
        line-height: 1;
      }

      .page-label {
        min-width: 70px;
        color: var(--muted);
        font-size: 13px;
        text-align: center;
      }

      .stage {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        grid-template-rows: repeat(2, minmax(0, 1fr));
        gap: 10px;
        min-height: 0;
        padding: 12px;
      }

      .tile {
        position: relative;
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        border: 2px solid transparent;
        border-radius: 8px;
        background:
          linear-gradient(45deg, rgba(0, 0, 0, 0.025) 25%, transparent 25%),
          linear-gradient(-45deg, rgba(0, 0, 0, 0.025) 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, rgba(0, 0, 0, 0.025) 75%),
          linear-gradient(-45deg, transparent 75%, rgba(0, 0, 0, 0.025) 75%),
          #ffffff;
        background-position:
          0 0,
          0 8px,
          8px -8px,
          -8px 0;
        background-size: 16px 16px;
        box-shadow: var(--shadow);
      }

      .tile.keep {
        border-color: var(--accent);
      }

      .tile.hold {
        border-color: var(--hold);
      }

      .tile.out {
        border-color: var(--out);
        opacity: 0.76;
      }

      .image-wrap {
        display: grid;
        min-height: 0;
        place-items: center;
        padding: 30px 10px 8px;
      }

      .image-wrap img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .number {
        position: absolute;
        top: 8px;
        left: 8px;
        display: inline-grid;
        min-width: 42px;
        height: 28px;
        place-items: center;
        border-radius: 6px;
        color: #fff;
        background: rgba(23, 23, 23, 0.88);
        font-size: 15px;
        font-weight: 800;
      }

      .status {
        position: absolute;
        top: 8px;
        right: 8px;
        display: none;
        height: 28px;
        align-items: center;
        padding: 0 9px;
        border-radius: 6px;
        color: #fff;
        font-size: 13px;
        font-weight: 700;
      }

      .tile.keep .status,
      .tile.hold .status,
      .tile.out .status {
        display: inline-flex;
      }

      .tile.keep .status {
        background: var(--accent);
      }

      .tile.hold .status {
        background: var(--hold);
      }

      .tile.out .status {
        background: var(--out);
      }

      .caption {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        align-items: center;
        min-height: 86px;
        padding: 8px;
        border-top: 1px solid rgba(0, 0, 0, 0.08);
        background: rgba(255, 253, 248, 0.92);
      }

      .filename {
        min-width: 0;
        overflow: hidden;
        color: #34322e;
        font-size: 12px;
        font-weight: 650;
        line-height: 1.25;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .actions {
        display: grid;
        grid-template-columns: repeat(3, 28px);
        gap: 4px;
      }

      .image-admin {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 4px;
      }

      .image-admin .button {
        width: 100%;
        height: 28px;
        min-width: 0;
        border: 1px solid var(--line);
        background: #ffffff;
        font-size: 12px;
      }

      .image-admin .button.danger {
        color: var(--out);
      }

      .vote-summary {
        grid-column: 1 / -1;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.2;
      }

      .vote-summary span {
        display: inline-flex;
        align-items: center;
        height: 22px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0 7px;
        background: rgba(255, 255, 255, 0.74);
      }

      .image-description {
        grid-column: 1 / -1;
        min-width: 0;
        color: #3e3b35;
        font-size: 12px;
        line-height: 1.35;
      }

      .description-input {
        grid-column: 1 / -1;
        width: 100%;
        height: 32px;
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0 9px;
        outline: 0;
        color: var(--ink);
        background: #ffffff;
        font-size: 12px;
      }

      .description-input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px rgba(15, 118, 110, 0.16);
      }

      .description-readonly {
        min-height: 22px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 5px 7px;
        background: rgba(255, 255, 255, 0.74);
      }

      .voter-pill {
        color: var(--accent);
        font-weight: 700;
      }

      .mark:disabled,
      .note-input:disabled {
        cursor: not-allowed;
        opacity: 0.52;
      }

      .note-input {
        grid-column: 1 / -1;
        width: 100%;
        height: 30px;
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0 9px;
        outline: 0;
        color: var(--ink);
        background: #ffffff;
        font-size: 12px;
      }

      .note-input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px rgba(15, 118, 110, 0.16);
      }

      .mark {
        width: 28px;
        height: 28px;
        border: 1px solid var(--line);
        border-radius: 6px;
        color: #4a4842;
        background: #ffffff;
        cursor: pointer;
        user-select: none;
      }

      .mark:hover {
        border-color: #8f887b;
      }

      .mark.keep.active {
        border-color: var(--accent);
        color: #fff;
        background: var(--accent);
      }

      .mark.hold.active {
        border-color: var(--hold);
        color: #fff;
        background: var(--hold);
      }

      .mark.out.active {
        border-color: var(--out);
        color: #fff;
        background: var(--out);
      }

      .empty {
        display: none;
        place-items: center;
        height: 100%;
        color: var(--muted);
        font-size: 18px;
      }

      .stage.is-empty {
        display: none;
      }

      .empty.is-visible {
        display: grid;
      }

      .log-panel {
        position: fixed;
        inset: 0 0 0 auto;
        z-index: 20;
        display: none;
        width: min(760px, 100%);
        border-left: 1px solid var(--line);
        background: var(--panel);
        box-shadow: -18px 0 40px rgba(24, 24, 24, 0.16);
      }

      .voter-panel {
        position: fixed;
        inset: 0 0 0 auto;
        z-index: 21;
        display: none;
        width: min(640px, 100%);
        border-left: 1px solid var(--line);
        background: var(--panel);
        box-shadow: -18px 0 40px rgba(24, 24, 24, 0.16);
      }

      .log-panel.open {
        display: grid;
        grid-template-rows: auto 1fr;
      }

      .voter-panel.open {
        display: grid;
        grid-template-rows: auto 1fr;
      }

      .log-head {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        justify-content: space-between;
        padding: 12px;
        border-bottom: 1px solid var(--line);
      }

      .log-head strong {
        font-size: 18px;
      }

      .log-actions {
        display: flex;
        gap: 8px;
      }

      .log-list {
        min-height: 0;
        overflow: auto;
        padding: 10px 12px 16px;
      }

      .voter-list {
        min-height: 0;
        overflow: auto;
        padding: 10px 12px 16px;
      }

      .voter-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 120px auto auto;
        gap: 8px;
        align-items: center;
        padding: 10px 0;
        border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      }

      .voter-main {
        min-width: 0;
      }

      .voter-main strong,
      .voter-main span {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .voter-main span,
      .usage-readonly {
        color: var(--muted);
        font-size: 12px;
      }

      .usage-input {
        width: 100%;
        height: 34px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0 8px;
        outline: 0;
        background: #ffffff;
      }

      .usage-input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px rgba(15, 118, 110, 0.16);
      }

      .log-row {
        display: grid;
        grid-template-columns: 126px 88px 1fr;
        gap: 8px;
        align-items: start;
        padding: 9px 0;
        border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        font-size: 13px;
        line-height: 1.35;
      }

      .log-row .muted {
        color: var(--muted);
      }

      @media (max-width: 1080px) {
        body {
          overflow: auto;
        }

        .app {
          min-height: 100dvh;
          height: auto;
        }

        .topbar {
          grid-template-columns: 1fr;
        }

        .toolbar {
          justify-content: flex-start;
        }

        .stage {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          grid-template-rows: repeat(5, minmax(190px, 1fr));
          height: auto;
          min-height: calc(100dvh - 130px);
        }
      }

      @media (max-width: 620px) {
        .topbar {
          padding-inline: 10px;
        }

        .toolbar,
        .segmented,
        .pager,
        .searchbox {
          width: 100%;
        }

        .toolbar {
          display: grid;
          grid-template-columns: 1fr;
        }

        .segmented,
        .pager {
          justify-content: space-between;
        }

        .stage {
          grid-template-columns: 1fr;
          grid-template-rows: none;
        }

        .tile {
          min-height: 320px;
        }

        .voter-row {
          grid-template-columns: 1fr;
        }

        .caption {
          grid-template-columns: 1fr;
          gap: 7px;
          min-height: 150px;
          padding: 9px;
        }

        .actions {
          grid-column: 1 / -1;
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 6px;
          width: 100%;
        }

        .mark {
          width: 100%;
          min-width: 0;
          height: 44px;
          min-height: 44px;
          border-radius: 7px;
          font-size: 15px;
          font-weight: 800;
        }

        .note-input {
          height: 40px;
          font-size: 14px;
        }

        .description-input {
          height: 40px;
          font-size: 14px;
        }

        .vote-summary span {
          height: 26px;
          font-size: 13px;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="title">
          <h1>产品委员会包装筛选展示</h1>
          <div class="meta">
            <span id="countLabel">共 0 张</span>
            <span>每屏 10 张</span>
            <span id="resultLabel">入选 0 / 待定 0 / 排除 0</span>
            <span class="voter-pill" id="voterLabel">主页面</span>
            <span id="usageLabel">使用次数：主页面设置</span>
            <span class="sync-state" id="syncLabel">连接服务器</span>
          </div>
        </div>
        <div class="toolbar" aria-label="筛选与翻页">
          <div class="searchbox">
            <input id="searchInput" type="search" placeholder="搜索文件名/留言" autocomplete="off" />
          </div>
          <div class="segmented" role="tablist" aria-label="结果筛选">
            <button class="button text active" type="button" data-filter="all">全部</button>
            <button class="button text" type="button" data-filter="keep">入选</button>
            <button class="button text" type="button" data-filter="hold">待定</button>
            <button class="button text" type="button" data-filter="out">排除</button>
          </div>
          <div class="pager">
            <button class="button icon" type="button" id="prevBtn" title="上一屏">‹</button>
            <span class="page-label" id="pageLabel">1 / 1</span>
            <button class="button icon" type="button" id="nextBtn" title="下一屏">›</button>
          </div>
          <button class="button text" type="button" id="createVoterBtn">新增外发端</button>
          <button class="button text host-only" type="button" id="voterSettingsBtn">分发设置</button>
          <button class="button text" type="button" id="copyLinkBtn">复制本端链接</button>
          <button class="button text host-only" type="button" id="addImageBtn">新增图片</button>
          <button class="button text" type="button" id="logBtn">日志</button>
          <button class="button text" type="button" id="exportBtn">导出全部</button>
          <button class="button text" type="button" id="fullBtn">全屏</button>
        </div>
      </header>
      <section class="stage" id="stage" aria-label="包装图片展示"></section>
      <section class="empty" id="empty">没有匹配的图片</section>
      <input class="file-input" id="addImageInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple />
      <input class="file-input" id="replaceImageInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" />
    </main>
    <aside class="log-panel" id="logPanel" aria-label="投票日志">
      <div class="log-head">
        <strong>投票日志</strong>
        <div class="log-actions">
          <button class="button text" type="button" id="exportLogsBtn">导出日志</button>
          <button class="button text" type="button" id="closeLogBtn">关闭</button>
        </div>
      </div>
      <div class="log-list" id="logList"></div>
    </aside>
    <aside class="voter-panel" id="voterPanel" aria-label="分发设置">
      <div class="log-head">
        <strong>分发设置</strong>
        <div class="log-actions">
          <button class="button text" type="button" id="closeVoterPanelBtn">关闭</button>
        </div>
      </div>
      <div class="voter-list" id="voterList"></div>
    </aside>

    <script>
      const initialImages = [

      const pageSize = 10;
      const projectId = "001-hyaluronic";
      const voterUrl = "/api/packaging-review/voter";
      const voterSettingsUrl = "/api/packaging-review/voter-settings";
      let images = initialImages.slice();
      const voteUrl = "/api/packaging-review/vote";
      const descriptionUrl = "/api/packaging-review/description";

      const logsUrl = `/api/packaging-review/logs?project=${encodeURIComponent(projectId)}`;
      const syncIntervalMs = 2500;
      const labels = { keep: "入选", hold: "待定", out: "排除" };
      const actionLabels = {
        "create-voter": "新增外发端",
        vote: "投票",
        "vote-click": "再次投票",
        "change-vote": "改票",
        cancel: "取消",

        update: "更新",
        "update-voter-usage": "修改使用次数",
        "image-description": "图片说明",

      const urlParams = new URLSearchParams(window.location.search);
      let voterId = urlParams.get("voter") || "";
      let page = 0;
      let filter = "all";
      let searchText = "";
      let marks = {};
      let notes = {};
      let descriptions = {};
      let summaries = {};
      let allVotes = {};
      let voters = [];
      let currentVoter = null;
      let recentEvents = [];
      let allEvents = [];
      let noteTimers = new Map();
      let descriptionTimers = new Map();
      let imageCacheBust = "";
      let pendingReplaceFile = "";
      let lastTouchVoteAt = 0;

      const stage = document.querySelector("#stage");
      const empty = document.querySelector("#empty");
      const countLabel = document.querySelector("#countLabel");
      const resultLabel = document.querySelector("#resultLabel");
      const voterLabel = document.querySelector("#voterLabel");
      const usageLabel = document.querySelector("#usageLabel");
      const syncLabel = document.querySelector("#syncLabel");
      const pageLabel = document.querySelector("#pageLabel");
      const searchInput = document.querySelector("#searchInput");
      const prevBtn = document.querySelector("#prevBtn");
      const nextBtn = document.querySelector("#nextBtn");
      const createVoterBtn = document.querySelector("#createVoterBtn");
      const voterSettingsBtn = document.querySelector("#voterSettingsBtn");
      const copyLinkBtn = document.querySelector("#copyLinkBtn");
      const addImageBtn = document.querySelector("#addImageBtn");
      const addImageInput = document.querySelector("#addImageInput");
      const replaceImageInput = document.querySelector("#replaceImageInput");
      const logBtn = document.querySelector("#logBtn");
      const exportBtn = document.querySelector("#exportBtn");
      const fullBtn = document.querySelector("#fullBtn");
      const logPanel = document.querySelector("#logPanel");
      const logList = document.querySelector("#logList");
      const closeLogBtn = document.querySelector("#closeLogBtn");
      const exportLogsBtn = document.querySelector("#exportLogsBtn");
      const voterPanel = document.querySelector("#voterPanel");
      const voterList = document.querySelector("#voterList");
      const closeVoterPanelBtn = document.querySelector("#closeVoterPanelBtn");

      function stateUrl() {
        const params = new URLSearchParams({ project: projectId });
        if (voterId) params.set("voter", voterId);
        return `/api/packaging-review/state?${params.toString()}`;
      }

      function setSyncLabel(text, isError = false) {
        syncLabel.textContent = text;
        syncLabel.classList.toggle("error", isError);
      }

      function canManageImages() {
        return !voterId;
      }

      function canVote() {
        return Boolean(voterId && currentVoter && hasUsageRemaining(currentVoter));
      }

      function hasUsageRemaining(voter) {
        const limit = usageLimitValue(voter);
        if (limit === null) return true;
        return Number(voter?.voteClickCount || 0) < limit;
      }

      function usageLimitValue(voter) {
        const value = voter?.usageLimit;
        return Number.isFinite(value) ? Math.max(0, Math.floor(value)) : null;
      }

      function usageText(voter) {
        if (!voter) return "使用次数：主页面设置";
        const used = Number(voter.voteClickCount || 0);
        const limit = usageLimitValue(voter);
        return `使用次数：${used} / ${limit === null ? "不限" : limit}`;
      }

      function parseUsageLimit(value) {
        const text = String(value || "").trim();
        if (!text) return null;
        const parsed = Number(text);
        if (!Number.isFinite(parsed)) return null;
        return Math.max(0, Math.min(99999, Math.floor(parsed)));
      }

      function syncHostControls() {
        addImageBtn.classList.toggle("is-hidden", !canManageImages());
        voterSettingsBtn.classList.toggle("is-hidden", !canManageImages());
      }

      function mergeRemoteImages(remoteImages) {
        if (!Array.isArray(remoteImages)) return;
        const remoteSet = new Set(remoteImages);
        images = images.filter((file) => remoteSet.has(file));
        remoteImages.forEach((file) => {
          if (!images.includes(file)) images.push(file);
        });
      }

      function getFilteredImages() {
        return images
          .map((file, index) => ({ file, index }))
          .filter((item) => {
            const summary = summaries[item.file] || {};
            const matchesFilter =
              filter === "all" || (canVote() ? marks[item.file] === filter : Number(summary[filter] || 0) > 0);
            const note = notes[item.file] || "";
            const description = descriptions[item.file] || "";
            const matchesSearch =
              item.file.toLowerCase().includes(searchText) ||
              note.toLowerCase().includes(searchText) ||
              description.toLowerCase().includes(searchText);
            return matchesFilter && matchesSearch;
          });
      }

      function updateSummary() {
        const totals = Object.values(summaries).reduce(
          (sum, item) => {
            sum.keep += Number(item.keep || 0);
            sum.hold += Number(item.hold || 0);
            sum.out += Number(item.out || 0);
            return sum;
          },
          { keep: 0, hold: 0, out: 0 },
        );
        countLabel.textContent = `共 ${images.length} 张`;
        resultLabel.textContent = `入选 ${totals.keep} / 待定 ${totals.hold} / 排除 ${totals.out}`;
        voterLabel.textContent = currentVoter ? `当前：${currentVoter.name}` : voterId ? "分发链接无效" : "主页面";
        usageLabel.textContent = currentVoter ? usageText(currentVoter) : "使用次数：主页面设置";
        usageLabel.classList.toggle("sync-state", Boolean(currentVoter));
        usageLabel.classList.toggle("error", Boolean(currentVoter && !hasUsageRemaining(currentVoter)));
      }

      function setMark(file, value) {
        if (!canVote()) {
          const message = currentVoter
            ? "使用次数已用完"
            : voterId
              ? "分发链接无效，无法投票"
              : "主页面无法投票，请使用分发链接";
          setSyncLabel(message, true);
          return;
        }
        marks[file] = value;
        render();
        syncVote(file, { recordClick: true });
      }

      function handleMarkPointer(event, file, value) {
        if (event.pointerType === "mouse") return;
        event.preventDefault();
        event.stopPropagation();
        lastTouchVoteAt = Date.now();
        setMark(file, value);
      }

      function handleMarkClick(event, file, value) {
        event.stopPropagation();
        if (Date.now() - lastTouchVoteAt < 520) return;
        setMark(file, value);
      }

      function setNote(file, value) {
        if (!canVote()) return;
        const note = value.slice(0, 60);
        if (note) {
          notes[file] = note;
        } else {
          delete notes[file];
        }
        window.clearTimeout(noteTimers.get(file));
        noteTimers.set(
          file,
          window.setTimeout(() => {
            syncVote(file);
            noteTimers.delete(file);
          }, 450),
        );
      }

      function setDescription(file, value) {
        if (!canManageImages()) return;
        const description = value.slice(0, 100);
        if (description) {
          descriptions[file] = description;
        } else {
          delete descriptions[file];
        }
        window.clearTimeout(descriptionTimers.get(file));
        descriptionTimers.set(
          file,
          window.setTimeout(() => {
            syncDescription(file);
            descriptionTimers.delete(file);
          }, 450),
        );
      }

      function activeNoteFile() {
        const active = document.activeElement;
        return active?.classList?.contains("note-input") ? active.dataset.file || "" : "";
      }

      function activeDescriptionFile() {
        const active = document.activeElement;
        return active?.classList?.contains("description-input") ? active.dataset.file || "" : "";
      }

      function applyRemoteState(payload, shouldRender = true) {
        const focusedFile = activeNoteFile();
        const focusedValue = focusedFile ? document.activeElement.value : "";
        const focusedDescriptionFile = activeDescriptionFile();
        const focusedDescriptionValue = focusedDescriptionFile ? document.activeElement.value : "";
        const nextMarks = {};
        const nextNotes = {};
        mergeRemoteImages(payload.images || []);
        summaries = payload.summaries || {};
        allVotes = payload.votes || {};
        descriptions = payload.descriptions || {};
        voters = Array.isArray(payload.voters) ? payload.voters : [];
        currentVoter = payload.voter || null;
        recentEvents = Array.isArray(payload.recentEvents) ? payload.recentEvents : [];
        imageCacheBust = payload.updatedAt || imageCacheBust;
        Object.entries(payload.currentVotes || {}).forEach(([file, item]) => {
          if (item.mark) nextMarks[file] = item.mark;
          if (item.note) nextNotes[file] = item.note;
        });
        if (focusedFile) nextNotes[focusedFile] = focusedValue;
        if (focusedDescriptionFile) descriptions[focusedDescriptionFile] = focusedDescriptionValue;
        marks = nextMarks;
        notes = nextNotes;
        if (shouldRender && !focusedFile && !focusedDescriptionFile) {
          render();
        } else {
          updateSummary();
        }
        syncHostControls();
        renderVoterPanel();
        renderLogs();
      }

      async function loadRemoteState({ silent = false } = {}) {
        try {
          if (!silent) setSyncLabel("同步中");
          const response = await fetch(stateUrl(), { cache: "no-store" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const payload = await response.json();
          if (!payload.ok) throw new Error(payload.error || "Sync failed");
          applyRemoteState(payload, true);
          setSyncLabel("已同步");
        } catch {
          setSyncLabel("同步失败", true);
        }
      }

      async function createVoter() {
        const fallbackName = `外发端${voters.length + 1}`;
        const name = window.prompt("外发端名称", fallbackName);
        if (name === null) return;
        const usageLimitText = window.prompt("使用次数，留空为不限", "");
        if (usageLimitText === null) return;
        try {
          setSyncLabel("生成链接中");
          const response = await fetch(voterUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ project: projectId, name, usageLimit: parseUsageLimit(usageLimitText) }),
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const payload = await response.json();
          if (!payload.ok || !payload.link) throw new Error(payload.error || "Create voter failed");
          await copyText(payload.link);
          await loadRemoteState({ silent: true });
          setSyncLabel("外发端链接已生成");
        } catch {
          setSyncLabel("生成失败", true);
        }
      }

      async function copyCurrentLink() {
        if (!voterId) {
          setSyncLabel("请先新增外发端", true);
          return;
        }
        await copyText(window.location.href);
        setSyncLabel("本端链接已生成");
      }

      async function copyText(text) {
        if (navigator.clipboard?.writeText) {
          try {
            await navigator.clipboard.writeText(text);
            return;
          } catch {
            // Fall through to a selectable prompt on non-secure HTTP pages.
          }
        }
        window.prompt("复制链接", text);
      }

      async function addImages(files) {
        if (!canManageImages() || !files.length) return;
        try {
          setSyncLabel("上传图片中");
          for (const file of files) {
            const dataUrl = await readFileAsDataUrl(file);
            const payload = await sendImageRequest({
              action: "add",
              name: file.name,
              dataUrl,
            });
            applyRemoteState(payload, false);
          }
          allEvents = [];
          await loadRemoteState({ silent: true });
          setSyncLabel("图片已新增");
        } catch (error) {
          setSyncLabel(error.message || "新增图片失败", true);
        } finally {
          addImageInput.value = "";
        }
      }

      async function replaceImage(file, selectedFile) {
        if (!canManageImages() || !file || !selectedFile) return;
        try {
          setSyncLabel("替换图片中");
          const dataUrl = await readFileAsDataUrl(selectedFile);
          const payload = await sendImageRequest({
            action: "replace",
            file,
            dataUrl,
          });
          allEvents = [];
          applyRemoteState(payload, true);
          setSyncLabel("图片已替换");
        } catch (error) {
          setSyncLabel(error.message || "替换图片失败", true);
        } finally {
          replaceImageInput.value = "";
          pendingReplaceFile = "";
        }
      }

      async function renameImage(file) {
        if (!canManageImages()) return;
        const name = window.prompt("图片文件名", file);
        if (name === null) return;
        try {
          setSyncLabel("修改图片中");
          const payload = await sendImageRequest({
            action: "rename",
            file,
            name,
          });
          allEvents = [];
          applyRemoteState(payload, true);
          setSyncLabel("图片名称已修改");
        } catch (error) {
          setSyncLabel(error.message || "修改图片失败", true);
        }
      }

      async function deleteImage(file) {
        if (!canManageImages()) return;
        if (!window.confirm(`确认删除图片：${file}？删除后这张图的投票也会清理。`)) return;
        try {
          setSyncLabel("删除图片中");
          const payload = await sendImageRequest({
            action: "delete",
            file,
          });
          allEvents = [];
          applyRemoteState(payload, true);
          setSyncLabel("图片已删除");
        } catch (error) {
          setSyncLabel(error.message || "删除图片失败", true);
        }
      }

      async function sendImageRequest(body) {
        const response = await fetch(imageUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ project: projectId, ...body }),
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok || !payload.ok) throw new Error(payload.error || `HTTP ${response.status}`);
        return payload;
      }

      async function syncDescription(file) {
        if (!canManageImages()) return;
        try {
          setSyncLabel("保存说明中");
          const response = await fetch(descriptionUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              project: projectId,
              file,
              description: descriptions[file] || "",
            }),
          });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok || !payload.ok) throw new Error(payload.error || `HTTP ${response.status}`);
          applyRemoteState(payload, true);
          setSyncLabel("说明已同步");
        } catch (error) {
          setSyncLabel(error.message || "说明保存失败", true);
        }
      }

      function readFileAsDataUrl(file) {
        return new Promise((resolve, reject) => {
          if (!file.type.startsWith("image/")) {
            reject(new Error("请选择图片文件。"));
            return;
          }
          const reader = new FileReader();
          reader.addEventListener("load", () => resolve(String(reader.result || "")));
          reader.addEventListener("error", () => reject(new Error("读取图片失败。")));
          reader.readAsDataURL(file);
        });
      }

      async function syncVote(file, options = {}) {
        if (!canVote()) return;
        try {
          setSyncLabel("保存中");
          const response = await fetch(voteUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              project: projectId,
              voter: voterId,
              file,
              mark: marks[file] || "",
              note: notes[file] || "",
              recordClick: options.recordClick === true,
            }),
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const payload = await response.json();
          if (!payload.ok) throw new Error(payload.error || "Save failed");
          applyRemoteState(payload, true);
          setSyncLabel("已同步");
        } catch {
          setSyncLabel("同步失败", true);
        }
      }

      async function loadLogs() {
        const response = await fetch(logsUrl, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const payload = await response.json();
        if (!payload.ok) throw new Error(payload.error || "Logs failed");
        allEvents = (payload.events || []).slice().reverse();
        renderLogs();
      }

      async function openLogs() {
        logPanel.classList.add("open");
        try {
          await loadLogs();
        } catch {
          renderLogs();
        }
      }

      async function openVoterPanel() {
        if (!canManageImages()) return;
        voterPanel.classList.add("open");
        renderVoterPanel();
        await loadRemoteState({ silent: true });
      }

      function renderVoterPanel() {
        if (!voterPanel.classList.contains("open")) return;
        if (!voters.length) {
          voterList.innerHTML = '<div class="log-row"><span class="muted">暂无分发端</span></div>';
          return;
        }
        voterList.innerHTML = "";
        voters.forEach((voter) => {
          const row = document.createElement("div");
          row.className = "voter-row";

          const main = document.createElement("div");
          main.className = "voter-main";
          const name = document.createElement("strong");
          name.textContent = voter.name || voter.id;
          const usage = document.createElement("span");
          usage.textContent = usageText(voter).replace("使用次数：", "已用 ");
          main.append(name, usage);

          const input = document.createElement("input");
          input.className = "usage-input";
          input.type = "number";
          input.min = "0";
          input.max = "99999";
          input.placeholder = "不限";
          const limit = usageLimitValue(voter);
          input.value = limit === null ? "" : String(limit);
          input.dataset.voter = voter.id;

          const save = document.createElement("button");
          save.className = "button text";
          save.type = "button";
          save.textContent = "保存";
          save.addEventListener("click", () => updateVoterUsage(voter.id, input.value));

          const copy = document.createElement("button");
          copy.className = "button text";
          copy.type = "button";
          copy.textContent = "复制";
          copy.addEventListener("click", async () => {
            await copyText(buildVoterShareLink(voter.id));
            setSyncLabel("分发链接已复制");
          });

          row.append(main, input, save, copy);
          voterList.append(row);
        });
      }

      function buildVoterShareLink(rowVoterId) {
        const url = new URL(window.location.href);
        url.search = "";
        url.searchParams.set("voter", rowVoterId);
        return url.toString();
      }

      async function updateVoterUsage(rowVoterId, value) {
        try {
          setSyncLabel("保存使用次数中");
          const response = await fetch(voterSettingsUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              project: projectId,
              voter: rowVoterId,
              usageLimit: parseUsageLimit(value),
            }),
          });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok || !payload.ok) throw new Error(payload.error || `HTTP ${response.status}`);
          applyRemoteState(payload, true);
          setSyncLabel("使用次数已保存");
        } catch (error) {
          setSyncLabel(error.message || "保存失败", true);
        }
      }

      function render() {
        updateSummary();
        const items = getFilteredImages();
        const totalPages = Math.max(1, Math.ceil(items.length / pageSize));
        page = Math.min(page, totalPages - 1);
        const pageItems = items.slice(page * pageSize, page * pageSize + pageSize);

        stage.innerHTML = "";
        stage.classList.toggle("is-empty", pageItems.length === 0);
        empty.classList.toggle("is-visible", pageItems.length === 0);
        pageLabel.textContent = `${page + 1} / ${totalPages}`;
        prevBtn.disabled = page === 0;
        nextBtn.disabled = page >= totalPages - 1;

        pageItems.forEach((item) => {
          const votingEnabled = canVote();
          const mark = marks[item.file] || "";
          const summary = summaries[item.file] || {};
          const tile = document.createElement("article");
          tile.className = `tile ${mark}`;

          const imageWrap = document.createElement("div");
          imageWrap.className = "image-wrap";

          const img = document.createElement("img");
          img.src = `${encodeURI(`images/${item.file}`)}${imageCacheBust ? `?v=${encodeURIComponent(imageCacheBust)}` : ""}`;
          img.alt = item.file;
          img.loading = "eager";
          img.decoding = "async";
          imageWrap.append(img);

          const number = document.createElement("div");
          number.className = "number";
          number.textContent = String(item.index + 1).padStart(2, "0");

          const status = document.createElement("div");
          status.className = "status";
          status.textContent = labels[mark] || "";

          const caption = document.createElement("footer");
          caption.className = "caption";

          const filename = document.createElement("div");
          filename.className = "filename";
          filename.title = item.file;
          filename.textContent = item.file;

          const actions = document.createElement("div");
          actions.className = "actions";

          [
            ["keep", "✓", "入选"],
            ["hold", "?", "待定"],
            ["out", "×", "排除"],
          ].forEach(([value, text, title]) => {
            const button = document.createElement("button");
            button.className = `mark ${value}${mark === value ? " active" : ""}`;
            button.type = "button";
            button.title = title;
            button.setAttribute("aria-label", title);
            button.textContent = isMobileViewport() ? title : text;
            button.disabled = !votingEnabled;
            button.addEventListener("pointerup", (event) => handleMarkPointer(event, item.file, value));
            button.addEventListener("click", (event) => handleMarkClick(event, item.file, value));
            actions.append(button);
          });

          const imageAdmin = document.createElement("div");
          imageAdmin.className = "image-admin";
          if (canManageImages()) {
            [
              ["替换", () => {
                pendingReplaceFile = item.file;
                replaceImageInput.click();
              }],
              ["改名", () => renameImage(item.file)],
              ["删除", () => deleteImage(item.file), "danger"],
            ].forEach(([text, handler, tone]) => {
              const button = document.createElement("button");
              button.className = `button text${tone ? ` ${tone}` : ""}`;
              button.type = "button";
              button.textContent = text;
              button.addEventListener("click", (event) => {
                event.stopPropagation();
                handler();
              });
              imageAdmin.append(button);
            });
          }

          const voteSummary = document.createElement("div");
          voteSummary.className = "vote-summary";
          voteSummary.innerHTML = `<span>入选 ${summary.keep || 0}</span><span>待定 ${summary.hold || 0}</span><span>排除 ${summary.out || 0}</span>`;

          let descriptionNode;
          if (canManageImages()) {
            descriptionNode = document.createElement("input");
            descriptionNode.className = "description-input";
            descriptionNode.type = "text";
            descriptionNode.maxLength = 100;
            descriptionNode.placeholder = "主页面填写一句话说明，分发页只读可见";
            descriptionNode.dataset.file = item.file;
            descriptionNode.value = descriptions[item.file] || "";
            descriptionNode.addEventListener("click", (event) => event.stopPropagation());
            descriptionNode.addEventListener("dblclick", (event) => event.stopPropagation());
            descriptionNode.addEventListener("input", () => setDescription(item.file, descriptionNode.value));
            descriptionNode.addEventListener("blur", () => syncDescription(item.file));
          } else {
            descriptionNode = document.createElement("div");
            descriptionNode.className = "image-description description-readonly";
            descriptionNode.textContent = descriptions[item.file] ? `说明：${descriptions[item.file]}` : "说明：暂无";
          }

          const noteInput = document.createElement("input");
          noteInput.className = "note-input";
          noteInput.type = "text";
          noteInput.maxLength = 60;
          noteInput.placeholder = votingEnabled
            ? "一句话留言"
            : currentVoter
              ? "使用次数已用完"
              : voterId
                ? "分发链接无效，无法留言"
                : "主页面不记录留言";
          noteInput.dataset.file = item.file;
          noteInput.value = notes[item.file] || "";
          noteInput.disabled = !votingEnabled;
          noteInput.addEventListener("click", (event) => event.stopPropagation());
          noteInput.addEventListener("dblclick", (event) => event.stopPropagation());
          noteInput.addEventListener("input", () => setNote(item.file, noteInput.value));
          noteInput.addEventListener("blur", () => syncVote(item.file));

          tile.addEventListener("dblclick", () => window.open(encodeURI(`images/${item.file}`), "_blank"));
          caption.append(filename, actions);
          if (canManageImages()) caption.append(imageAdmin);
          caption.append(descriptionNode, voteSummary, noteInput);
          tile.append(imageWrap, number, status, caption);
          stage.append(tile);
        });
      }

      async function exportAllStats() {
        try {
          setSyncLabel("导出统计中");
          await loadRemoteState({ silent: true });
          try {
            await loadLogs();
          } catch {
            // Recent logs are still included if the full log request fails.
          }
          const rows = [];
          addCsvSection(rows, "总览", ["项目", "数值"], buildOverviewRows());
          addCsvSection(rows, "图片汇总", [
            "序号",
            "文件名",
            "图片说明",
            "入选数",
            "待定数",
            "排除数",
            "总投票数",
            "入选外发端",
            "待定外发端",
            "排除外发端",
            "留言汇总",
          ], buildImageSummaryRows());
          addCsvSection(rows, "外发端汇总", [
            "外发端",
            "已用次数",
            "使用上限",
            "剩余次数",
            "入选数",
            "待定数",
            "排除数",
            "留言数",
            "创建时间",
            "最后更新时间",
          ], buildVoterSummaryRows());
          addCsvSection(rows, "投票明细", [
            "序号",
            "文件名",
            "图片说明",
            "外发端",
            "筛选结果",
            "留言",
            "更新时间",
          ], buildVoteDetailRows());
          addCsvSection(rows, "日志明细", [
            "时间",
            "操作者",
            "图片序号",
            "文件名",
            "新文件名",
            "图片说明",
            "操作",
            "筛选结果",
            "留言",
            "原筛选结果",
            "原留言",
          ], buildLogRows());
          downloadCsv(rows, "产品委员会包装全部统计.csv");
          setSyncLabel("统计已导出");
        } catch {
          setSyncLabel("导出失败", true);
        }
      }

      function exportLogs() {
        const rows = [["时间", "操作者", "图片序号", "文件名", "新文件名", "图片说明", "操作", "筛选结果", "留言", "原筛选结果", "原留言"], ...buildLogRows()];
        downloadCsv(rows, "产品委员会包装投票日志.csv");
      }

      function addCsvSection(rows, title, headers, sectionRows) {
        if (rows.length) rows.push([]);
        rows.push([title]);
        rows.push(headers);
        sectionRows.forEach((row) => rows.push(row));
      }

      function buildOverviewRows() {
        const totals = Object.values(summaries).reduce(
          (sum, item) => {
            sum.keep += Number(item.keep || 0);
            sum.hold += Number(item.hold || 0);
            sum.out += Number(item.out || 0);
            return sum;
          },
          { keep: 0, hold: 0, out: 0 },
        );
        return [
          ["导出时间", formatTime(new Date().toISOString())],
          ["项目", projectId],
          ["图片总数", images.length],
          ["外发端总数", voters.length],
          ["入选总票数", totals.keep],
          ["待定总票数", totals.hold],
          ["排除总票数", totals.out],
          ["日志条数", (allEvents.length ? allEvents : recentEvents).length],
        ];
      }

      function buildImageSummaryRows() {
        return images.map((file, index) => {
          const summary = summaries[file] || {};
          return [
            String(index + 1).padStart(2, "0"),
            file,
            descriptions[file] || "",
            summary.keep || 0,
            summary.hold || 0,
            summary.out || 0,
            summary.total || 0,
            voterNamesByMark(file, "keep"),
            voterNamesByMark(file, "hold"),
            voterNamesByMark(file, "out"),
            notesForFile(file),
          ];
        });
      }

      function buildVoterSummaryRows() {
        return voters.map((voter) => {
          const counts = countVotesForVoter(voter.id);
          const used = Number(voter.voteClickCount || 0);
          const limit = usageLimitValue(voter);
          return [
            voter.name || voter.id,
            used,
            limit === null ? "不限" : limit,
            limit === null ? "不限" : Math.max(0, limit - used),
            counts.keep,
            counts.hold,
            counts.out,
            counts.notes,
            voter.createdAt || "",
            voter.updatedAt || "",
          ];
        });
      }

      function buildVoteDetailRows() {
        const rows = [];
        images.forEach((file, index) => {
          Object.entries(allVotes[file] || {}).forEach(([rowVoterId, vote]) => {
            rows.push([
              String(index + 1).padStart(2, "0"),
              file,
              descriptions[file] || "",
              voterName(rowVoterId),
              labels[vote.mark] || "",
              vote.note || "",
              vote.updatedAt || "",
            ]);
          });
        });
        return rows;
      }

      function buildLogRows() {
        const events = allEvents.length ? allEvents.slice().reverse() : recentEvents.slice().reverse();
        return events.map((event) => [
          event.at || "",
          eventActor(event),
          imageNumber(event.file),
          event.file || "",
          event.nextFile || "",
          descriptions[event.file] || "",
          actionLabels[event.action] || event.action || "",
          labels[event.mark] || "",
          event.note || "",
          labels[event.previousMark] || "",
          event.previousNote || "",
        ]);
      }

      function voterNamesByMark(file, mark) {
        return Object.entries(allVotes[file] || {})
          .filter(([, vote]) => vote.mark === mark)
          .map(([rowVoterId]) => voterName(rowVoterId))
          .join("；");
      }

      function notesForFile(file) {
        return Object.entries(allVotes[file] || {})
          .filter(([, vote]) => vote.note)
          .map(([rowVoterId, vote]) => `${voterName(rowVoterId)}：${vote.note}`)
          .join("；");
      }

      function countVotesForVoter(rowVoterId) {
        return images.reduce(
          (counts, file) => {
            const vote = allVotes[file]?.[rowVoterId];
            if (!vote) return counts;
            const mark = vote.mark || "";
            if (counts[mark] !== undefined) counts[mark] += 1;
            if (vote.note) counts.notes += 1;
            return counts;
          },
          { keep: 0, hold: 0, out: 0, notes: 0 },
        );
      }

      function downloadCsv(rows, filename) {
        const csv = rows.map((row) => row.map((cell) => `"${String(cell).replaceAll('"', '""')}"`).join(",")).join("\n");
        const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = filename;
        link.click();
        URL.revokeObjectURL(link.href);
      }

      function renderLogs() {
        const events = allEvents.length ? allEvents : recentEvents;
        if (!events.length) {
          logList.innerHTML = '<div class="log-row"><span class="muted">暂无日志</span></div>';
          return;
        }
        logList.innerHTML = "";
        events.forEach((event) => {
          const row = document.createElement("div");
          row.className = "log-row";
          row.innerHTML = `
            <span class="muted">${formatTime(event.at)}</span>
            <strong>${eventActor(event)}</strong>
            <span>${imageNumber(event.file)} ${event.file || ""}${event.nextFile ? ` → ${event.nextFile}` : ""}<br><span class="muted">${actionLabels[event.action] || event.action || ""} ${labels[event.mark] || ""} ${event.note || ""}</span></span>
          `;
          logList.append(row);
        });
      }

      function eventActor(event) {
        return event.voterName || voterName(event.voterId) || "图片管理";
      }

      function voterName(rowVoterId) {
        return voters.find((voter) => voter.id === rowVoterId)?.name || rowVoterId || "";
      }

      function imageNumber(file) {
        const index = images.indexOf(file);
        return index >= 0 ? String(index + 1).padStart(2, "0") : "";
      }

      function formatTime(value) {
        if (!value) return "";
        return new Date(value).toLocaleString("zh-CN", { hour12: false });
      }

      function isMobileViewport() {
        return window.matchMedia("(max-width: 620px)").matches;
      }

      document.querySelectorAll("[data-filter]").forEach((button) => {
        button.addEventListener("click", () => {
          document.querySelectorAll("[data-filter]").forEach((item) => item.classList.remove("active"));
          button.classList.add("active");
          filter = button.dataset.filter;
          page = 0;
          render();
        });
      });

      searchInput.addEventListener("input", () => {
        searchText = searchInput.value.trim().toLowerCase();
        page = 0;
        render();
      });

      prevBtn.addEventListener("click", () => {
        page = Math.max(0, page - 1);
        render();
      });

      nextBtn.addEventListener("click", () => {
        page += 1;
        render();
      });

      createVoterBtn.addEventListener("click", createVoter);
      voterSettingsBtn.addEventListener("click", openVoterPanel);
      copyLinkBtn.addEventListener("click", copyCurrentLink);
      addImageBtn.addEventListener("click", () => addImageInput.click());
      addImageInput.addEventListener("change", () => addImages(Array.from(addImageInput.files || [])));
      replaceImageInput.addEventListener("change", () => replaceImage(pendingReplaceFile, replaceImageInput.files?.[0]));
      logBtn.addEventListener("click", openLogs);
      closeLogBtn.addEventListener("click", () => logPanel.classList.remove("open"));
      closeVoterPanelBtn.addEventListener("click", () => voterPanel.classList.remove("open"));
      exportBtn.addEventListener("click", exportAllStats);
      exportLogsBtn.addEventListener("click", async () => {
        try {
          await loadLogs();
        } catch {
          // Keep the latest visible logs if the full log request fails.
        }
        exportLogs();
      });

      fullBtn.addEventListener("click", () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen();
        } else {
          document.exitFullscreen();
        }
      });

      window.addEventListener("keydown", (event) => {
        if (event.key === "ArrowLeft") prevBtn.click();
        if (event.key === "ArrowRight" || event.key === " ") nextBtn.click();
        if (event.key.toLowerCase() === "f") fullBtn.click();
      });

      syncHostControls();
      render();
      loadRemoteState();
      window.setInterval(() => loadRemoteState({ silent: true }), syncIntervalMs);
    </script>
  </body>
</html>
