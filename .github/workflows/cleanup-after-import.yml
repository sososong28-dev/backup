name: Cleanup Backup Repository

on:
  push:
    paths:
      - .github/workflows/cleanup-after-import.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Remove duplicate root files and temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github debug .gitignore deploy package.json packaging-review server.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit."
          else
            git commit -m "Clean categorized backup repository"
            git push
          fi
