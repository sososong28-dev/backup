name: Debug Backup Downloads

on:
  push:
    paths:
      - .github/workflows/debug-downloads.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug-downloads:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download full ZIP and commit report
        shell: bash
        run: |
          set +e
          mkdir -p debug
          report="debug/import-downloads.txt"
          {
            echo "Generated at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "== full ZIP download =="
            curl -L --max-time 180 --output /tmp/github-backup.zip --write-out 'http=%{http_code} size=%{size_download} time=%{time_total}\n' "https://litter.catbox.moe/wg0pft.zip"
            echo "curl_exit=$?"
            ls -lh /tmp/github-backup.zip 2>/dev/null
            echo
            echo "== sha256 =="
            sha256sum /tmp/github-backup.zip 2>&1
            echo "expected=3534e586c3f68f8fccc51ae04e2cc4a0c4afb1763d88675c833b5e5e14066d87"
            echo
            echo "== unzip list first 40 =="
            unzip -l /tmp/github-backup.zip 2>&1 | head -40
            echo "unzip_exit=${PIPESTATUS[0]}"
          } > "$report" 2>&1

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$report"
          if git diff --cached --quiet; then
            echo "No debug report changes."
          else
            git commit -m "Update backup download diagnostics"
            git push
          fi
