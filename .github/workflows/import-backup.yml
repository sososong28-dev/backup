name: Import Categorized Backup

on:
  push:
    paths:
      - .github/workflows/import-backup.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-backup:
    runs-on: ubuntu-latest
    steps:
      - name: Import backup archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Preparing repository checkout"
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin main
          git checkout -B main FETCH_HEAD

          echo "Downloading portable backup archive parts"
          mkdir -p /tmp/backup-parts /tmp/github-backup-extract
          curl -L --fail --retry 5 --retry-delay 5 -o /tmp/backup-parts/part-000.bin "https://tmpfiles.org/dl/wawygla4kWp1/part-000.bin"
          curl -L --fail --retry 5 --retry-delay 5 -o /tmp/backup-parts/part-001.bin "https://tmpfiles.org/dl/wAwXgpaVP0XS/part-001.bin"
          curl -L --fail --retry 5 --retry-delay 5 -o /tmp/backup-parts/part-002.bin "https://tmpfiles.org/dl/wMw8gUaDqLEj/part-002.bin"
          curl -L --fail --retry 5 --retry-delay 5 -o /tmp/backup-parts/part-003.bin "https://tmpfiles.org/dl/wawbgAaxNN6O/part-003.bin"
          cat /tmp/backup-parts/part-000.bin /tmp/backup-parts/part-001.bin /tmp/backup-parts/part-002.bin /tmp/backup-parts/part-003.bin > /tmp/github-backup.zip
          ls -lh /tmp/github-backup.zip
          echo "3fb66d25ba39025550827ab7f1dc9d2e7b368485c8b6297c69c3639183c472f6  /tmp/github-backup.zip" | sha256sum -c -

          echo "Extracting and copying backup"
          unzip -q /tmp/github-backup.zip -d /tmp/github-backup-extract
          find /tmp/github-backup-extract -maxdepth 3 -type f | sort | head -80
          cp -a /tmp/github-backup-extract/. ./

          echo "Committing imported files"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "No backup changes to commit."
          else
            git commit -m "Import categorized project backup"
            git push origin HEAD:main
          fi
